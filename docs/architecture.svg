  <text x="194.3" y="-775.8"
        font-family="ui-monospace,monospace" font-size="9.5" letter-spacing="0.4" fill="#8A887F">POST + bearer</text>

  
  <polygon points="-207.8,-740.0 242.5,-480.0 242.5,-466.0 -207.8,-726.0" fill="#D7D3C6"/>
  <polygon points="450.3,-600.0 242.5,-480.0 242.5,-466.0 450.3,-586.0" fill="#EAE7DD"/>
  <polygon points="0.0,-860.0 450.3,-600.0 242.5,-480.0 -207.8,-740.0" fill="#FBFAF7" stroke="#E3E0D6" stroke-width="1.5"/>
  
  <text x="-306" y="-766.0" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1.6" fill="#2743C7">② EXECUTION</text>
  <text x="-306" y="-748.0" font-family="ui-sans-serif,system-ui" font-size="11.5" fill="#8A887F">lib/tick.ts — one cycle, from either trigger</text>
