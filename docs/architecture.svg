  <line x1="90.1" y1="-598.0" x2="90.1" y2="-189.0"
        stroke="#8A887F" stroke-width="1.8" marker-end="url(#headg)"/>
  <text x="99.1" y="-390.0"
        font-family="ui-monospace,monospace" font-size="9.5" letter-spacing="0.4" fill="#8A887F">recall / remember</text>
  
  <line x1="237.3" y1="-513.0" x2="237.3" y2="-104.0"
        stroke="#8A887F" stroke-width="1.8" marker-end="url(#headg)"/>
  <text x="246.3" y="-305.0"
        font-family="ui-monospace,monospace" font-size="9.5" letter-spacing="0.4" fill="#8A887F">fetch</text>

  
  <polygon points="-207.8,-310.0 242.5,-50.0 242.5,-36.0 -207.8,-296.0" fill="#D7D3C6"/>
  <polygon points="450.3,-170.0 242.5,-50.0 242.5,-36.0 450.3,-156.0" fill="#EAE7DD"/>
