    <text x="9" y="26" font-family="ui-monospace,monospace" font-size="8.5" fill="#8A887F">Gemini in reserve</text>
  </g>

  
  <line x1="-65.8" y1="-258.0" x2="-65.8" y2="151.0"
        stroke="#2743C7" stroke-width="1.8" marker-end="url(#head)"/>
  <text x="-56.8" y="-50.0"
        font-family="ui-monospace,monospace" font-size="9.5" letter-spacing="0.4" fill="#2743C7">read-only projection</text>

  
  <polygon points="-207.8,120.0 242.5,380.0 242.5,394.0 -207.8,134.0" fill="#D7D3C6"/>
  <polygon points="450.3,260.0 242.5,380.0 242.5,394.0 450.3,274.0" fill="#EAE7DD"/>
  <polygon points="0.0,0.0 450.3,260.0 242.5,380.0 -207.8,120.0" fill="#FBFAF7" stroke="#E3E0D6" stroke-width="1.5"/>
  
  <text x="-306" y="94.0" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1.6" fill="#2743C7">④ SERVING</text>
  <text x="-306" y="112.0" font-family="ui-sans-serif,system-ui" font-size="11.5" fill="#8A887F">Vercel Hobby — serves, never drives</text>
  <line x1="-306" y1="118.0" x2="-221.8" y2="118.0" stroke="#E3E0D6" stroke-width="1.5"/>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,-41.57,50.00)">
    <rect width="132" height="34" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.3" rx="2"/>
    <text x="9" y="14" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#1A1915">POST /api/agent/init</text>
    <text x="9" y="26" font-family="ui-monospace,monospace" font-size="8.5" fill="#8A887F">persona → agentId</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,110.85,138.00)">
