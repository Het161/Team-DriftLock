    <text x="9" y="14" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#1A1915">wire · newsroom</text>
    <text x="9" y="26" font-family="ui-monospace,monospace" font-size="8.5" fill="#8A887F">server components</text>
  </g>

  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,-294.45,-20.00)">
    <rect width="140" height="34" fill="#F6F5F1" stroke="#C63B21" stroke-width="1.5" rx="2"/>
    <text x="9" y="14" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#1A1915">Evaluator</text>
    <text x="9" y="26" font-family="ui-monospace,monospace" font-size="8.5" fill="#8A887F">init once, then polls</text>
  </g>
  <line x1="-178.4" y1="59.0"
        x2="-84.9" y2="67.0"
        stroke="#C63B21" stroke-width="1.8" marker-end="url(#headr)"/>

  <text x="-306" y="428" font-family="ui-monospace,monospace" font-size="10.5" letter-spacing="0.8" fill="#8A887F">PLANE ① REACHES PLANE ③ BY TWO INDEPENDENT ROUTES — ONE THROUGH VERCEL, ONE AROUND IT.</text>
  <text x="-306" y="446" font-family="ui-monospace,monospace" font-size="10.5" letter-spacing="0.8" fill="#8A887F">EITHER PROVIDER CAN BE DOWN AND THE WIRE KEEPS FILING.</text>
