    <text x="9" y="14" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#1A1915">GET /api/agent/feed</text>
    <text x="9" y="26" font-family="ui-monospace,monospace" font-size="8.5" fill="#8A887F">five fields, forever</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,263.27,226.00)">
