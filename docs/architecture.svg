  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,110.85,-292.00)">
    <rect width="132" height="34" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.3" rx="2"/>
    <text x="9" y="14" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#1A1915">Breeth graph</text>
    <text x="9" y="26" font-family="ui-monospace,monospace" font-size="8.5" fill="#8A887F">scoped per agent</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,263.27,-204.00)">
