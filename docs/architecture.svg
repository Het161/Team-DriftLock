  <rect x="-330" y="-1410" width="1090" height="1900" fill="#F6F5F1"/>

  <text x="-306" y="-1354" font-family="ui-serif,Georgia,serif" font-size="30" fill="#1A1915">TAAR — the four planes</text>
  <text x="-306" y="-1330" font-family="ui-monospace,monospace" font-size="10.5" letter-spacing="1.3" fill="#8A887F">THE DEPLOYMENT SERVES THE FEED. IT IS NOT WHAT FILLS IT.</text>

  
  <polygon points="-207.8,-1170.0 242.5,-910.0 242.5,-896.0 -207.8,-1156.0" fill="#D7D3C6"/>
  <polygon points="450.3,-1030.0 242.5,-910.0 242.5,-896.0 450.3,-1016.0" fill="#EAE7DD"/>
  <polygon points="0.0,-1290.0 450.3,-1030.0 242.5,-910.0 -207.8,-1170.0" fill="#FBFAF7" stroke="#E3E0D6" stroke-width="1.5"/>
  
  <text x="-306" y="-1196.0" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1.6" fill="#2743C7">① TRIGGER</text>
  <text x="-306" y="-1178.0" font-family="ui-sans-serif,system-ui" font-size="11.5" fill="#8A887F">two schedulers, both always on</text>
  <line x1="-306" y1="-1172.0" x2="-221.8" y2="-1172.0" stroke="#E3E0D6" stroke-width="1.5"/>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,-41.57,-1240.00)">
    <rect width="132" height="34" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.3" rx="2"/>
    <text x="9" y="14" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#1A1915">GitHub Actions</text>
    <text x="9" y="26" font-family="ui-monospace,monospace" font-size="8.5" fill="#8A887F">cron 9,39</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,110.85,-1152.00)">
    <rect width="132" height="34" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.3" rx="2"/>
    <text x="9" y="14" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#1A1915">cron-job.org</text>
    <text x="9" y="26" font-family="ui-monospace,monospace" font-size="8.5" fill="#8A887F">every 30 min</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,263.27,-1064.00)">
    <rect width="132" height="34" fill="#F6F5F1" stroke="#8A887F" stroke-width="1.3" rx="2"/>
    <text x="9" y="14" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#1A1915">either may stall</text>
    <text x="9" y="26" font-family="ui-monospace,monospace" font-size="8.5" fill="#8A887F">other covers ~20 min</text>
  </g>

  
  <line x1="-65.8" y1="-1118.0" x2="-65.8" y2="-709.0"
