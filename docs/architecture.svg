<svg xmlns="http://www.w3.org/2000/svg" viewBox="-370 -1455 1029 2010" width="1029" height="2010" font-family="ui-sans-serif,system-ui">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2743C7"/>
    </marker>
    <marker id="headg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A887F"/>
    </marker>
    <marker id="headr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C63B21"/>
    </marker>
  </defs>
  <rect x="-370" y="-1455" width="1029" height="2010" fill="#F6F5F1"/>

  <text x="-344" y="-1389" font-family="ui-serif,Georgia,serif" font-size="38" fill="#1A1915">TAAR — the four planes</text>
  <text x="-344" y="-1359" font-family="ui-monospace,monospace" font-size="13.5" letter-spacing="1.5" fill="#8A887F">THE DEPLOYMENT SERVES THE FEED. IT IS NOT WHAT FILLS IT.</text>

  
  <polygon points="-129.9,-1215.0 459.0,-875.0 459.0,-859.0 -129.9,-1199.0" fill="#D7D3C6"/>
  <polygon points="588.9,-950.0 459.0,-875.0 459.0,-859.0 588.9,-934.0" fill="#EAE7DD"/>
  <polygon points="0.0,-1290.0 588.9,-950.0 459.0,-875.0 -129.9,-1215.0" fill="#FBFAF7" stroke="#E3E0D6" stroke-width="1.6"/>
  
  <text x="-344" y="-1094.5" font-family="ui-monospace,monospace" font-size="19" letter-spacing="2" fill="#2743C7">① TRIGGER</text>
  <text x="-344" y="-1070.5" font-family="ui-sans-serif,system-ui" font-size="14.5" fill="#8A887F">two schedulers, both always on</text>
  <line x1="-344" y1="-1056.5" x2="-83.0" y2="-1056.5" stroke="#E3E0D6" stroke-width="1.6"/>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,-10.39,-1256.00)">
    <rect width="170" height="50" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.6" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">GitHub Actions</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">cron 9,39 hourly</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,185.33,-1143.00)">
    <rect width="170" height="50" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.6" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">cron-job.org</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">every 30 minutes</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,381.05,-1030.00)">
    <rect width="170" height="50" fill="#F6F5F1" stroke="#8A887F" stroke-width="1.6" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">either may stall</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">other covers, ~20 min</text>
  </g>

  
  <line x1="10.4" y1="-1150.0" x2="10.4" y2="-744.0"
        stroke="#2743C7" stroke-width="2" marker-end="url(#head)"/>
  <text x="22.4" y="-943.0"
        font-family="ui-monospace,monospace" font-size="13" letter-spacing="0.5" fill="#2743C7">runs tick.ts on GitHub's runner</text>
  
  <line x1="365.5" y1="-945.0" x2="365.5" y2="321.0"
        stroke="#8A887F" stroke-width="2" marker-end="url(#headg)"/>
  <text x="377.5" y="-792.1"
        font-family="ui-monospace,monospace" font-size="13" letter-spacing="0.5" fill="#8A887F">POST + bearer</text>

  
  <polygon points="-129.9,-785.0 459.0,-445.0 459.0,-429.0 -129.9,-769.0" fill="#D7D3C6"/>
  <polygon points="588.9,-520.0 459.0,-445.0 459.0,-429.0 588.9,-504.0" fill="#EAE7DD"/>
  <polygon points="0.0,-860.0 588.9,-520.0 459.0,-445.0 -129.9,-785.0" fill="#FBFAF7" stroke="#E3E0D6" stroke-width="1.6"/>
  
  <text x="-344" y="-664.5" font-family="ui-monospace,monospace" font-size="19" letter-spacing="2" fill="#2743C7">② EXECUTION</text>
  <text x="-344" y="-640.5" font-family="ui-sans-serif,system-ui" font-size="14.5" fill="#8A887F">lib/tick.ts — one cycle, from either trigger</text>
  <line x1="-344" y1="-626.5" x2="-83.0" y2="-626.5" stroke="#E3E0D6" stroke-width="1.6"/>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,-10.39,-826.00)">
    <rect width="170" height="50" fill="#F6F5F1" stroke="#2743C7" stroke-width="1.6" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">discover → judge</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">then file, or not</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,185.33,-713.00)">
    <rect width="170" height="50" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.6" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">Mongo lease, 8 min</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">second arrival exits</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,381.05,-600.00)">
    <rect width="170" height="50" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.6" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">roster by lastRunAt</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">3 agents, rotating</text>
  </g>

  
  <line x1="-12.1" y1="-733.0" x2="-12.1" y2="-327.0"
        stroke="#2743C7" stroke-width="2" marker-end="url(#head)"/>
  <text x="-0.1" y="-526.0"
        font-family="ui-monospace,monospace" font-size="13" letter-spacing="0.5" fill="#2743C7">read + write</text>
  
  <line x1="183.6" y1="-620.0" x2="183.6" y2="-214.0"
        stroke="#8A887F" stroke-width="2" marker-end="url(#headg)"/>
  <text x="195.6" y="-413.0"
        font-family="ui-monospace,monospace" font-size="13" letter-spacing="0.5" fill="#8A887F">recall / remember</text>
  
  <line x1="417.4" y1="-485.0" x2="417.4" y2="-79.0"
        stroke="#8A887F" stroke-width="2" marker-end="url(#headg)"/>
  <text x="429.4" y="-278.0"
        font-family="ui-monospace,monospace" font-size="13" letter-spacing="0.5" fill="#8A887F">fetch</text>

  
  <polygon points="-129.9,-355.0 459.0,-15.0 459.0,1.0 -129.9,-339.0" fill="#D7D3C6"/>
  <polygon points="588.9,-90.0 459.0,-15.0 459.0,1.0 588.9,-74.0" fill="#EAE7DD"/>
  <polygon points="0.0,-430.0 588.9,-90.0 459.0,-15.0 -129.9,-355.0" fill="#FBFAF7" stroke="#E3E0D6" stroke-width="1.6"/>
  
  <text x="-344" y="-234.5" font-family="ui-monospace,monospace" font-size="19" letter-spacing="2" fill="#2743C7">③ STATE</text>
  <text x="-344" y="-210.5" font-family="ui-sans-serif,system-ui" font-size="14.5" fill="#8A887F">Mongo, memory, models and the four sources</text>
  <line x1="-344" y1="-196.5" x2="-83.0" y2="-196.5" stroke="#E3E0D6" stroke-width="1.6"/>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,-10.39,-396.00)">
    <rect width="170" height="50" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.6" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">MongoDB Atlas M0</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">five collections</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,185.33,-283.00)">
    <rect width="170" height="50" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.6" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">Breeth graph</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">scoped per agent</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,381.05,-170.00)">
    <rect width="170" height="50" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.6" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">Groq 8b + 70b</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">Gemini in reserve</text>
  </g>

  
  <line x1="10.4" y1="-290.0" x2="10.4" y2="116.0"
        stroke="#2743C7" stroke-width="2" marker-end="url(#head)"/>
  <text x="22.4" y="-83.0"
        font-family="ui-monospace,monospace" font-size="13" letter-spacing="0.5" fill="#2743C7">read-only projection</text>

  
  <polygon points="-129.9,75.0 459.0,415.0 459.0,431.0 -129.9,91.0" fill="#D7D3C6"/>
  <polygon points="588.9,340.0 459.0,415.0 459.0,431.0 588.9,356.0" fill="#EAE7DD"/>
  <polygon points="0.0,0.0 588.9,340.0 459.0,415.0 -129.9,75.0" fill="#FBFAF7" stroke="#E3E0D6" stroke-width="1.6"/>
  
  <text x="-344" y="195.5" font-family="ui-monospace,monospace" font-size="19" letter-spacing="2" fill="#2743C7">④ SERVING</text>
  <text x="-344" y="219.5" font-family="ui-sans-serif,system-ui" font-size="14.5" fill="#8A887F">Vercel Hobby — serves, never drives</text>
  <line x1="-344" y1="233.5" x2="-83.0" y2="233.5" stroke="#E3E0D6" stroke-width="1.6"/>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,-10.39,34.00)">
    <rect width="170" height="50" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.6" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">POST /api/agent/init</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">persona → agentId</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,185.33,147.00)">
    <rect width="170" height="50" fill="#F6F5F1" stroke="#2743C7" stroke-width="1.6" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">GET /api/agent/feed</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">five fields, forever</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,381.05,260.00)">
    <rect width="170" height="50" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.6" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">wire · newsroom</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">server components</text>
  </g>

  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,-290.98,-64.00)">
    <rect width="180" height="50" fill="#F6F5F1" stroke="#C63B21" stroke-width="1.8" rx="2"/>
    <text x="14" y="21" font-family="ui-sans-serif,system-ui" font-size="16" fill="#1A1915">Evaluator</text>
    <text x="14" y="39" font-family="ui-monospace,monospace" font-size="13" fill="#8A887F">init once, then polls</text>
  </g>
  <line x1="-133.4" y1="35.0"
        x2="-46.8" y2="45.0"
        stroke="#C63B21" stroke-width="2" marker-end="url(#headr)"/>

  <text x="-344" y="481" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1" fill="#8A887F">PLANE ① REACHES PLANE ③ BY TWO INDEPENDENT ROUTES — ONE THROUGH VERCEL, ONE AROUND IT.</text>
  <text x="-344" y="505" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1" fill="#8A887F">EITHER PROVIDER CAN BE DOWN AND THE WIRE KEEPS FILING.</text>
</svg>
