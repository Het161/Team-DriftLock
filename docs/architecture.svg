    <text x="9" y="26" font-family="ui-monospace,monospace" font-size="8.5" fill="#8A887F">13 steps · 8 calls max</text>
  </g>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,110.85,-722.00)">
