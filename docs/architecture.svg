  <text x="-306" y="-336.0" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1.6" fill="#2743C7">③ STATE · MEMORY · SOURCES</text>
  <text x="-306" y="-318.0" font-family="ui-sans-serif,system-ui" font-size="11.5" fill="#8A887F">what a cycle reads from and writes to</text>
  <line x1="-306" y1="-312.0" x2="-221.8" y2="-312.0" stroke="#E3E0D6" stroke-width="1.5"/>
  
  <g transform="matrix(0.8660254037844387,0.5,-0.8660254037844387,0.5,-41.57,-380.00)">
    <rect width="132" height="34" fill="#F6F5F1" stroke="#1A1915" stroke-width="1.3" rx="2"/>
    <text x="9" y="14" font-family="ui-sans-serif,system-ui" font-size="10.5" fill="#1A1915">MongoDB Atlas M0</text>
